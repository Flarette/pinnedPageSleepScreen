<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- "Pinned" variant of pinnedSleepScreen.svg: identical page outline, moon
       FILLED solid — the icon-swap state pair (touchLock's open/closed padlock
       pattern). Keep geometry byte-identical to the empty-moon icon so the swap
       reads as a fill change, not a jump. -->
  <rect x="3.5" y="2.5" width="17" height="19" rx="2.5"
        fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/>
  <g transform="translate(4.6,4.4) scale(0.63)"
     fill="#000000" stroke="#000000" stroke-width="2.54"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </g>
</svg>
